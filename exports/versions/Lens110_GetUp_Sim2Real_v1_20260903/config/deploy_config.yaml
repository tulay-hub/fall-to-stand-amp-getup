# 0.656756 = 官方标准站姿 (新 default_joint_pos_rad) 在 MJCF 下脚底 8 角精确贴地的骨盆高度。
standing_pelvis_height_m: 0.656756
# 与训练侧 terminations.bad_base_height.minimum_height 保持一致 (v5c = 0.44)。
fall_detection_height_m: 0.44
fall_detection_tilt_deg: 70.0
real_robot_mapping:
  joint_order: null
  joint_direction:
    left_hip_pitch_joint: 1
    left_hip_roll_joint: 1
    left_hip_yaw_joint: -1
    left_knee_joint: -1
    left_ankle_pitch_joint: 1
    left_ankle_roll_joint: -1
