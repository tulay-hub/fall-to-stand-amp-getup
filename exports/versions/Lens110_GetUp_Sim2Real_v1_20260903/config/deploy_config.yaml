    left_shoulder_pitch_joint: 1
    left_shoulder_roll_joint: 1
    left_shoulder_yaw_joint: -1
    left_elbow_joint: -1
  ankle_name_map:
    left_ankle_pitch_joint: left_ankle_upper_joint
    left_ankle_roll_joint: left_ankle_lower_joint
    right_ankle_pitch_joint: right_ankle_upper_joint
    right_ankle_roll_joint: right_ankle_lower_joint
  note: 实机关节顺序与 MJCF 不同(实机 torso 在第21位且左臂在前); 踝 pitch<->upper / roll<->lower 同名同侧
deploy_entry: policy/Lens110-AMP-GetUp_model_54500.onnx
sim2sim: replay/play_lens110_amp_getup.py
known_issues_see: docs/KNOWN_ISSUES.md
