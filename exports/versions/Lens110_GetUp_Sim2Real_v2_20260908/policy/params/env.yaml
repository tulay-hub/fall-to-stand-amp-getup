      mode: fixed
      target: null
      type: directional
      castshadow: true
      pos: !!python/tuple
      - 0.0
      - 0.0
      - 1.5
      dir: !!python/tuple
      - 0.0
      - 0.0
      - -1.0
      cutoff: 45.0
      exponent: 10.0
    cameras: !!python/tuple []
    textures: !!python/tuple
    - name: groundplane
      type: 2d
      builtin: checker
      rgb1: !!python/tuple
      - 0.2
      - 0.3
      - 0.4
      rgb2: !!python/tuple
      - 0.1
      - 0.2
      - 0.3
      width: 300
      height: 300
      mark: edge
      markrgb: !!python/tuple
      - 0.8
      - 0.8
      - 0.8
    materials: !!python/tuple
    - name: groundplane
      rgba: !!python/tuple
      - 1.0
      - 1.0
      - 1.0
      - 1.0
      texuniform: true
      texrepeat: !!python/tuple
      - 4.0
      - 4.0
      reflectance: 0.2
      texture: groundplane
      geom_names_expr: !!python/tuple
      - terrain$
    collisions: !!python/tuple []
    terrain_type: plane
    terrain_generator: null
    env_spacing: 2.0
    max_init_terrain_level: 5
    num_envs: 2048
  entities:
    robot:
      init_state:
        pos: !!python/tuple
        - 0.0
        - 0.0
        - 0.65
        rot: !!python/tuple
        - 1.0
        - 0.0
        - 0.0
        - 0.0
        lin_vel: !!python/tuple
        - 0.0
        - 0.0
        - 0.0
        ang_vel: !!python/tuple
        - 0.0
        - 0.0
        - 0.0
        joint_pos:
          .*_hip_pitch_joint: -0.14
          left_hip_roll_joint: -0.01
          right_hip_roll_joint: 0.01
          left_hip_yaw_joint: -0.1
          right_hip_yaw_joint: 0.1
          .*_knee_joint: 0.36
          .*_ankle_pitch_joint: -0.23804
          left_ankle_roll_joint: 0.002027
          right_ankle_roll_joint: -0.002027
          torso_yaw_joint: 0.0
          .*shoulder_pitch_joint: 0.4
          left_shoulder_roll_joint: 0.2
          right_shoulder_roll_joint: -0.2
          .*shoulder_yaw_joint: 0.0
          left_elbow_joint: -0.8
          right_elbow_joint: -0.8
        joint_vel:
          .*: 0.0
      spec_fn: !!python/name:src.assets.robots.lens110.lens110_constants.get_spec ''
      articulation:
        actuators: !!python/tuple
        - target_names_expr: !!python/tuple
          - .*_hip_pitch_joint
          - .*_hip_roll_joint
          - .*_hip_yaw_joint
          - .*_knee_joint
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: 0.01
          frictionloss: 0.01
          stiffness: 40.0
          damping: 5.0
          effort_limit: 80.0
        - target_names_expr: !!python/tuple
          - .*_ankle_pitch_joint
          - .*_ankle_roll_joint
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: 0.01
          frictionloss: 0.01
          stiffness: 30.0
          damping: 5.0
          effort_limit: 36.0
        - target_names_expr: !!python/tuple
          - .*shoulder_pitch_joint
          - .*shoulder_roll_joint
          - .*shoulder_yaw_joint
          - .*elbow_joint
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: 0.01
          frictionloss: 0.01
          stiffness: 20.0
          damping: 1.0
          effort_limit: 36.0
        - target_names_expr: !!python/tuple
          - torso_yaw_joint
          transmission_type: !!python/object/apply:mjlab.actuator.actuator.TransmissionType
          - joint
          armature: 0.01
          frictionloss: 0.01
          stiffness: 100.0
          damping: 5.0
          effort_limit: 80.0
        soft_joint_pos_limit_factor: 0.9
      sort_actuators: false
      lights: !!python/tuple []
      cameras: !!python/tuple []
      textures: !!python/tuple []
      materials: !!python/tuple []
      collisions: !!python/tuple
      - geom_names_expr: !!python/tuple
        - .*_collision
        contype: 1
        conaffinity: 1
        condim:
          ^(left|right)_ankle_(roll|pitch)_collision$: 3
          .*_collision: 1
        priority:
          ^(left|right)_ankle_(roll|pitch)_collision$: 1
        friction:
          ^(left|right)_ankle_(roll|pitch)_collision$: !!python/tuple
          - 0.6
        solref: null
        solimp: null
        disable_other_geoms: true
  sensors: !!python/tuple
  - name: feet_ground_contact
    primary:
      mode: subtree
      pattern: ^(left_ankle_roll_link|right_ankle_roll_link)$
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: body
      pattern: terrain
      entity: null
      exclude: !!python/tuple []
    fields: !!python/tuple
    - found
    - force
    reduce: netforce
    num_slots: 1
    secondary_policy: first
    track_air_time: true
    global_frame: false
    history_length: 0
    debug: false
  - name: self_collision
    primary:
      mode: subtree
      pattern: pelvis
      entity: robot
      exclude: !!python/tuple []
    secondary:
      mode: subtree
      pattern: pelvis
      entity: robot
      exclude: !!python/tuple []
    fields: !!python/tuple
