# Lens110「倒地自动起身」实机部署参数 (从训练快照与实机配置生成, 2026-09-03)
robot_model: Lens110 21dof (MJCF, 平脚底碰撞盒)
training_run: lens110-amp-mjlab getup_v5/2026-09-08_15-43-38_v5f (model_72500)
frequencies:
  physics_hz: 500
  timestep: 0.002
  policy_hz: 100
  decimation: 5
observation:
  dim: 288
  history: 4
  ordering: time_major
  terms:
  - base_ang_vel
  - projected_gravity
  - command
  - joint_pos_rel
  - joint_vel_rel
  - prev_actions
  command_always_zero: true
  needs_motion_file: false
action:
  dim: 21
  joint_order: MJCF 顺序
  use_default_offset: true
  formula: q_des[i] = default_joint_pos[i] + action_scale[i] * action[i]  (不 clip action)
  clip_actions: null
  joint_pos_limits_clamped_at_target: false
joint_names_mjcf:
- left_hip_pitch_joint
- left_hip_roll_joint
- left_hip_yaw_joint
- left_knee_joint
- left_ankle_pitch_joint
- left_ankle_roll_joint
- right_hip_pitch_joint
- right_hip_roll_joint
- right_hip_yaw_joint
- right_knee_joint
- right_ankle_pitch_joint
- right_ankle_roll_joint
- torso_yaw_joint
- right_shoulder_pitch_joint
- right_shoulder_roll_joint
- right_shoulder_yaw_joint
- right_elbow_joint
- left_shoulder_pitch_joint
- left_shoulder_roll_joint
- left_shoulder_yaw_joint
- left_elbow_joint
